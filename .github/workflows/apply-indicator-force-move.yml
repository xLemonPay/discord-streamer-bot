name: Apply reliable indicator move fix

on:
  push:
    paths:
      - '.github/workflows/apply-indicator-force-move.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch bot.py
        run: python .github/scripts/patch_indicator_force_move.py

      - name: Validate Python
        run: python -m py_compile bot.py

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "xLemonPay Bot Update"
          git config user.email "actions@users.noreply.github.com"
          git add bot.py
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Force indicators into Clan KITEZH"
          git push
