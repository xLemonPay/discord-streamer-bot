name: Apply Clan KITEZH indicator layout

on:
  push:
    paths:
      - '.github/workflows/apply-home-indicators.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Remove one-off workflow'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Streamer Bot layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          path = Path('bot.py')
          code = path.read_text(encoding='utf-8')
          start_marker = 'async def ensure_top_indicators(guild: discord.Guild) -> tuple[discord.VoiceChannel, discord.VoiceChannel]:'
          end_marker = '\n\nasync def update_member_counter'
          start = code.index(start_marker)
          end = code.index(end_marker, start)
          replacement = base64.b64decode('').decode('utf-8')
          code = code[:start] + replacement + code[end:]

          assert 'CH_WELCOME = "👋・bienvenidas"' in code
          assert 'find_text(member.guild, CH_WELCOME)' in code
          assert 'CH_WELCOME,\n        member_readonly' in code

          path.write_text(code, encoding='utf-8')
          PY

      - name: Validate Python
        run: python -m py_compile bot.py

      - name: Commit change
        shell: bash
        run: |
          git config user.name "xLemonPay"
          git config user.email "109448695+xLemonPay@users.noreply.github.com"
          git add bot.py
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Move member indicators under Clan KITEZH"
          git push
